<svg xmlns="http://www.w3.org/2000/svg" width="827" height="510" viewBox="0 0 827 510" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="827" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="413" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">LID 分配：连续块（base LID + 端口偏移）</text>
  <text x="413" y="54" text-anchor="middle" font-size="12" fill="#888888">每台交换机一个 base LID，物理端口依次 base+1、base+2…… HCA 端口接着往下排</text>

  <!-- 交换机 -->
  <rect x="120" y="80" width="330" height="180" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="285" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">交换机</text>
  <text x="285" y="136" text-anchor="middle" font-size="13" fill="#333333">base LID = 1（自身）</text>
  <text x="285" y="164" text-anchor="middle" font-size="13" fill="#333333">port 0（管理端口）= LID 1</text>
  <text x="285" y="190" text-anchor="middle" font-size="13" fill="#333333">port 1 = LID 2</text>
  <text x="285" y="216" text-anchor="middle" font-size="13" fill="#333333">port 2 = LID 3</text>
  <text x="285" y="242" text-anchor="middle" font-size="13" fill="#333333">port 3 = LID 4</text>

  <!-- 三条物理链路 -->
  <line x1="170" y1="260" x2="170" y2="318" stroke="#666666" stroke-width="1.5"/>
  <line x1="285" y1="260" x2="285" y2="318" stroke="#666666" stroke-width="1.5"/>
  <line x1="400" y1="260" x2="400" y2="318" stroke="#666666" stroke-width="1.5"/>
  <text x="182" y="292" font-size="12" fill="#555555">port 1</text>
  <text x="297" y="292" font-size="12" fill="#555555">port 2</text>
  <text x="412" y="292" font-size="12" fill="#555555">port 3</text>

  <!-- HCA A -->
  <rect x="120" y="320" width="100" height="80" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="170" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">HCA A</text>
  <text x="170" y="378" text-anchor="middle" font-size="13" fill="#333333">LID 5</text>

  <!-- HCA B -->
  <rect x="235" y="320" width="100" height="80" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="285" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">HCA B</text>
  <text x="285" y="378" text-anchor="middle" font-size="13" fill="#333333">LID 6</text>

  <!-- HCA C -->
  <rect x="350" y="320" width="100" height="80" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="400" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">HCA C</text>
  <text x="400" y="378" text-anchor="middle" font-size="13" fill="#333333">LID 7</text>

  <!-- 底部说明 -->
  <rect x="120" y="440" width="330" height="60" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="285" y="466" text-anchor="middle" font-size="13" fill="#333333">物理端口 LID = base LID + 端口偏移</text>
  <text x="285" y="488" text-anchor="middle" font-size="12" fill="#888888">同一交换机的 LID 聚成连续区间</text>

  <!-- LMC 多路径旁注 -->
  <rect x="520" y="80" width="270" height="200" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="655" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">LMC：一个端口 → 多个 LID</text>
  <text x="655" y="136" text-anchor="middle" font-size="12.5" fill="#333333">LMC（LID Mask Count）给每个端口</text>
  <text x="655" y="156" text-anchor="middle" font-size="12.5" fill="#333333">再扩 N 位，同一端口得到 2^N 个 LID</text>
  <text x="655" y="184" text-anchor="middle" font-size="12.5" fill="#333333">默认 LMC = 0：每端口 1 个 LID</text>
  <text x="655" y="208" text-anchor="middle" font-size="12.5" fill="#333333">LMC = 1：每端口 2 个 LID（多路径）</text>
  <text x="655" y="240" text-anchor="middle" font-size="11" fill="#888888">注：LID 0 为保留值，不分配</text>
  <text x="655" y="264" text-anchor="middle" font-size="11" fill="#888888">多 LID 供上层做负载均衡 / 多路径</text>
</svg>
