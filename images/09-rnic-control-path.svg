<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="230" fill="#ffffff"/>

  <text x="20" y="22" font-size="13" font-weight="bold" fill="#333333">控制面：一条管理命令从主机到网卡、再回到主机的 8 步</text>

  <!-- 8 个步骤盒子 -->
  <g font-size="11.5" fill="#333333" text-anchor="middle">
    <rect x="20" y="45" width="88" height="88" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="64" y="86" font-size="13" font-weight="bold">① 主机驱动</text>

    <rect x="122" y="45" width="88" height="88" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="166" y="80">② 写命令到</text>
    <text x="166" y="96">共享内存</text>

    <rect x="224" y="45" width="88" height="88" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="268" y="86" font-size="13">③ 写门铃</text>

    <rect x="326" y="45" width="88" height="88" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="370" y="80" font-size="13">④ 控制核</text>
    <text x="370" y="96">取命令</text>

    <rect x="428" y="45" width="88" height="88" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="472" y="80" font-size="13">⑤ 解析</text>
    <text x="472" y="96">执行</text>

    <rect x="530" y="45" width="88" height="88" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="574" y="80">⑥ 配置数据面</text>
    <text x="574" y="96">引擎表项</text>

    <rect x="632" y="45" width="88" height="88" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="676" y="80" font-size="13">⑦ 写完成</text>
    <text x="676" y="96">(错误码)</text>

    <rect x="734" y="45" width="88" height="88" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="778" y="80">⑧ 中断通知</text>
    <text x="778" y="96">主机</text>
  </g>

  <!-- 步骤间箭头 -->
  <g stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="108" y1="89" x2="118" y2="89"/>
    <line x1="210" y1="89" x2="220" y2="89"/>
    <line x1="312" y1="89" x2="322" y2="89"/>
    <line x1="414" y1="89" x2="424" y2="89"/>
    <line x1="516" y1="89" x2="526" y2="89"/>
    <line x1="618" y1="89" x2="628" y2="89"/>
    <line x1="720" y1="89" x2="730" y2="89"/>
  </g>

  <!-- 控制核下方标注：紧耦合内存 -->
  <line x1="370" y1="133" x2="370" y2="162" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="305" y="163" width="130" height="46" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/>
  <text x="370" y="184" text-anchor="middle" font-size="12" fill="#333333">紧耦合内存</text>
  <text x="370" y="200" text-anchor="middle" font-size="11" fill="#555555">(ISR / 栈 / 热数据)</text>
</svg>
