<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">源码篇 3.3：LID 分配 → minhop 路由 → LFT 生成</text>

  <!-- 阶段表头 -->
  <rect x="60" y="56" width="220" height="30" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="170" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">① LID 分配 · osm_lid_mgr.c</text>
  <rect x="335" y="56" width="220" height="30" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="445" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">② 路由计算 · minhop</text>
  <rect x="610" y="56" width="220" height="30" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">③ LFT 生成与下发</text>

  <!-- 列间衔接箭头 -->
  <line x1="283" y1="71" x2="332" y2="71" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="307" y="64" text-anchor="middle" font-size="11" fill="#777777">LID 就绪</text>
  <line x1="558" y1="71" x2="607" y2="71" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="582" y="64" text-anchor="middle" font-size="11" fill="#777777">矩阵收敛</text>

  <!-- 第①列 LID 分配 -->
  <rect x="60" y="110" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="170" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">osm_lid_mgr_process_sm</text>
  <text x="170" y="156" text-anchor="middle" font-size="11" fill="#444444">复位 port_lid_tbl 与空闲区间</text>

  <rect x="60" y="192" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="170" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">lid_mgr_process_our_sm_node</text>
  <text x="170" y="238" text-anchor="middle" font-size="11" fill="#444444">SM 自身端口先分 base LID</text>

  <rect x="60" y="274" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="170" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">osm_lid_mgr_process_subnet</text>
  <text x="170" y="320" text-anchor="middle" font-size="11" fill="#444444">遍历 port_guid_tbl，跳过自己</text>

  <rect x="60" y="356" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="170" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">lid_mgr_get_port_lid</text>
  <text x="170" y="402" text-anchor="middle" font-size="11" fill="#444444">1&lt;&lt;LMC 个 LID，对齐取连续区间</text>

  <rect x="60" y="438" width="220" height="64" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="170" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">lid_mgr_set_physp_pi</text>
  <text x="170" y="484" text-anchor="middle" font-size="11" fill="#444444">Set(PortInfo) 下发 base LID</text>

  <!-- 第②列 minhop 路由 -->
  <rect x="335" y="110" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="445" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">osm_ucast_mgr_process</text>
  <text x="445" y="156" text-anchor="middle" font-size="11" fill="#444444">setup_all_switches 重置矩阵</text>

  <rect x="335" y="192" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="445" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">ucast_mgr_route</text>
  <text x="445" y="238" text-anchor="middle" font-size="11" fill="#444444">遍历路由引擎链表，minhop 默认</text>

  <rect x="335" y="274" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="445" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">build_lid_matrices</text>
  <text x="445" y="320" text-anchor="middle" font-size="11" fill="#444444">hop_0_1 初始化 0 / 1 跳</text>

  <rect x="335" y="356" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="445" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">process_neighbors 松弛</text>
  <text x="445" y="402" text-anchor="middle" font-size="11" fill="#444444">吸收邻居跳数，最多 N−1 轮收敛</text>

  <rect x="335" y="438" width="220" height="64" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="445" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">hops[LID][0] = 最少跳数</text>
  <text x="445" y="484" text-anchor="middle" font-size="11" fill="#444444">每台交换机一张跳数矩阵</text>

  <!-- 第③列 LFT 生成与下发 -->
  <rect x="610" y="110" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">ucast_mgr_build_lfts</text>
  <text x="720" y="156" text-anchor="middle" font-size="11" fill="#444444">跳数矩阵 → 每台交换机 LFT</text>

  <rect x="610" y="192" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">ucast_mgr_process_tbl</text>
  <text x="720" y="238" text-anchor="middle" font-size="11" fill="#444444">遍历端口 × LMC 偏移</text>

  <rect x="610" y="274" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">osm_switch_recommend_path</text>
  <text x="720" y="320" text-anchor="middle" font-size="11" fill="#444444">跳数最少中挑路径数最少</text>

  <rect x="610" y="356" width="220" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">new_lft[lid] = port</text>
  <text x="720" y="402" text-anchor="middle" font-size="11" fill="#444444">逐 LID 结果写入 new_lft</text>

  <rect x="610" y="438" width="220" height="64" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="720" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">set_fwd_tables 分块下发</text>
  <text x="720" y="484" text-anchor="middle" font-size="11" fill="#444444">每台交换机一份 new_lft，见 3.4</text>

  <!-- 列内箭头 -->
  <line x1="170" y1="174" x2="170" y2="190" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="256" x2="170" y2="272" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="338" x2="170" y2="354" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="420" x2="170" y2="436" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="174" x2="445" y2="190" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="256" x2="445" y2="272" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="338" x2="445" y2="354" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="420" x2="445" y2="436" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="174" x2="720" y2="190" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="256" x2="720" y2="272" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="338" x2="720" y2="354" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="420" x2="720" y2="436" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
