<svg xmlns="http://www.w3.org/2000/svg" width="900" height="736" viewBox="0 0 900 736" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="736" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">源码篇 3.2：sweep 逐跳发现流程</text>

  <!-- A：hop 0 启动 -->
  <rect x="360" y="80" width="300" height="58" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="510" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">do_sweep → state_mgr_sweep_hop_0</text>
  <text x="510" y="125" text-anchor="middle" font-size="11" fill="#444444">清 node / port / sw 计数 · in_sweep_hop_0 = TRUE</text>

  <!-- B：hop 0 自查询 -->
  <rect x="360" y="162" width="300" height="54" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="510" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Get(NodeInfo)，hop = 0（查自己）</text>
  <text x="510" y="204" text-anchor="middle" font-size="11" fill="#444444">ni handler 建新节点 → 再请求自己 PortInfo</text>

  <!-- 判断 C：还有未探测端口？ -->
  <polygon points="510,240 615,278 510,316 405,278" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="510" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">还有未探测</text>
  <text x="510" y="291" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">端口？</text>

  <!-- D：sweep 完成 -->
  <rect x="680" y="240" width="210" height="76" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="785" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">sweep 完成，发出信号</text>
  <text x="785" y="288" text-anchor="middle" font-size="11" fill="#444444">DISCOVERY_COMPLETED → MASTER</text>
  <text x="785" y="306" text-anchor="middle" font-size="11" fill="#444444">MASTER_OR_HIGHER → STANDBY</text>

  <!-- E：路径扩展，请求对端 -->
  <rect x="360" y="346" width="300" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="510" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">pi_rcv_process_switch_ext_port</text>
  <text x="510" y="391" text-anchor="middle" font-size="11" fill="#444444">osm_dr_path_extend（path, port）路径加一跳</text>
  <text x="510" y="408" text-anchor="middle" font-size="11" fill="#444444">→ Get(NodeInfo) 请求对端</text>

  <!-- F：对端入树 -->
  <rect x="360" y="444" width="300" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="510" y="468" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">对端 ni_rcv_process_new</text>
  <text x="510" y="489" text-anchor="middle" font-size="11" fill="#444444">osm_node_new / osm_port_new</text>
  <text x="510" y="506" text-anchor="middle" font-size="11" fill="#444444">插入 node_guid_tbl / port_guid_tbl</text>

  <!-- 判断 G：是交换机？ -->
  <polygon points="510,542 615,580 510,618 405,580" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="510" y="585" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">是交换机？</text>

  <!-- H：请求 SwitchInfo -->
  <rect x="360" y="642" width="300" height="78" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="510" y="666" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">请求 Get(SwitchInfo)</text>
  <text x="510" y="687" text-anchor="middle" font-size="11" fill="#444444">si_rcv_process_new：osm_switch_new</text>
  <text x="510" y="704" text-anchor="middle" font-size="11" fill="#444444">入 sw_guid_tbl，收紧 max_ucast_lid_ho</text>

  <!-- 右下旁注 -->
  <rect x="680" y="600" width="210" height="90" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="785" y="624" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">全程经 DR SMP（QP0）</text>
  <text x="785" y="645" text-anchor="middle" font-size="11" fill="#444444">请求与响应异步往返</text>
  <text x="785" y="663" text-anchor="middle" font-size="11" fill="#444444">响应在 dispatcher 回调中处理</text>

  <!-- 主干箭头 -->
  <line x1="510" y1="138" x2="510" y2="160" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="216" x2="510" y2="238" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="316" x2="510" y2="344" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="418" x2="510" y2="442" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="516" x2="510" y2="540" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="618" x2="510" y2="640" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C 否分支 -->
  <line x1="615" y1="278" x2="678" y2="278" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="646" y="270" text-anchor="middle" font-size="11" fill="#777777">否</text>

  <!-- C / G 是分支 -->
  <text x="521" y="334" text-anchor="start" font-size="11" fill="#777777">是</text>
  <text x="521" y="634" text-anchor="start" font-size="11" fill="#777777">是</text>

  <!-- 左侧回环主通道：H 处理完 → 返回判断 C -->
  <polyline points="360,681 270,681 270,278 403,278" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="276" y="673" text-anchor="start" font-size="11" fill="#777777">处理完继续判断</text>

  <!-- G 否支线：非交换机直接返回，并入左侧通道 -->
  <polyline points="405,580 272,580" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="338" y="572" text-anchor="middle" font-size="11" fill="#777777">否：返回</text>
</svg>
