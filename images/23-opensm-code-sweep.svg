<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="680" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">源码篇 3.2：sweep 逐跳发现流程</text>

  <!-- 左侧旁注 -->
  <rect x="50" y="60" width="200" height="76" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="150" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">全程经 DR SMP（QP0）</text>
  <text x="150" y="107" text-anchor="middle" font-size="11" fill="#444444">请求与响应异步往返</text>
  <text x="150" y="125" text-anchor="middle" font-size="11" fill="#444444">响应在 dispatcher 回调中处理</text>

  <!-- A：hop 0 启动 -->
  <rect x="300" y="60" width="300" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">do_sweep → state_mgr_sweep_hop_0</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#444444">清 node / port / sw 计数 · in_sweep_hop_0 = TRUE</text>

  <!-- B：hop 0 自查询 -->
  <rect x="300" y="152" width="300" height="56" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Get(NodeInfo)，hop = 0（查自己）</text>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#444444">ni handler 建新节点 → 再请求自己 PortInfo</text>

  <!-- 判断 C：还有未探测端口？ -->
  <polygon points="450,240 555,280 450,320 345,280" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">还有未探测</text>
  <text x="450" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">端口？</text>

  <!-- 否：sweep 完成 -->
  <rect x="590" y="248" width="270" height="76" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="725" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">sweep 完成，发出信号</text>
  <text x="725" y="294" text-anchor="middle" font-size="11" fill="#444444">DISCOVERY_COMPLETED → 转 MASTER</text>
  <text x="725" y="312" text-anchor="middle" font-size="11" fill="#444444">或 MASTER_OR_HIGHER → 转 STANDBY</text>

  <!-- E：路径扩展，请求对端 -->
  <rect x="300" y="352" width="300" height="76" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">pi_rcv_process_switch_ext_port</text>
  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#444444">osm_dr_path_extend（path, port）路径加一跳</text>
  <text x="450" y="416" text-anchor="middle" font-size="11" fill="#444444">→ Get(NodeInfo) 请求对端</text>

  <!-- F：对端入树 -->
  <rect x="300" y="456" width="300" height="76" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">对端 ni_rcv_process_new</text>
  <text x="450" y="502" text-anchor="middle" font-size="11" fill="#444444">osm_node_new / osm_port_new</text>
  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#444444">插入 node_guid_tbl / port_guid_tbl</text>

  <!-- 判断 G：是交换机？ -->
  <polygon points="450,548 555,588 450,628 345,588" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="593" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">是交换机？</text>

  <!-- 是：请求 SwitchInfo -->
  <rect x="590" y="548" width="270" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="725" y="572" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">请求 Get(SwitchInfo)</text>
  <text x="725" y="594" text-anchor="middle" font-size="11" fill="#444444">si_rcv_process_new：osm_switch_new</text>
  <text x="725" y="612" text-anchor="middle" font-size="11" fill="#444444">入 sw_guid_tbl，收紧 max_ucast_lid_ho</text>

  <!-- 主干箭头 -->
  <line x1="450" y1="124" x2="450" y2="150" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="208" x2="450" y2="238" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="320" x2="450" y2="350" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="428" x2="450" y2="454" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="532" x2="450" y2="546" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C 各分支 -->
  <line x1="555" y1="280" x2="588" y2="280" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="272" text-anchor="middle" font-size="11" fill="#777777">否</text>
  <text x="460" y="342" text-anchor="start" font-size="11" fill="#777777">是</text>

  <!-- G 各分支 -->
  <line x1="555" y1="588" x2="588" y2="588" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="566" y="580" text-anchor="middle" font-size="11" fill="#777777">是</text>

  <!-- 右侧回环：处理完交换机，返回判断 C -->
  <polyline points="860,588 880,588 880,280 557,280" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="786" y="418" width="88" height="20" fill="#ffffff"/>
  <text x="872" y="433" text-anchor="end" font-size="11" fill="#777777">处理完继续判断</text>

  <!-- 左侧回环：非交换机，返回判断 C -->
  <polyline points="345,588 320,588 320,280 343,280" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="254" y="432" width="64" height="20" fill="#ffffff"/>
  <text x="314" y="447" text-anchor="end" font-size="11" fill="#777777">否：返回</text>
</svg>
