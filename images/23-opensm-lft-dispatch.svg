<svg xmlns="http://www.w3.org/2000/svg" width="827" height="450" viewBox="0 0 827 450" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="827" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
    <marker id="arrow-trap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="413" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">LFT 下发与稳态：分块下发 + trap 回环</text>

  <!-- SM（Master） -->
  <rect x="313" y="60" width="200" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="413" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">SM（Master）</text>
  <text x="413" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">持有算好的 LFT</text>

  <!-- 下发箭头：SM -> 交换机 1/2/3 -->
  <line x1="363" y1="132" x2="155" y2="268" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="413" y1="132" x2="413" y2="268" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="463" y1="132" x2="630" y2="268" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 中间箭头标签：SMP 写 LFT -->
  <rect x="253" y="218" width="320" height="24" fill="#ececec"/>
  <text x="413" y="235" text-anchor="middle" font-size="12" fill="#000000">SMP 写 LinearForwardingTable（分块下发，逐块确认）</text>

  <!-- trap 回环：交换机 3 -> SM（红色） -->
  <line x1="714" y1="270" x2="513" y2="114" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow-trap)"/>
  <rect x="655" y="152" width="164" height="42" fill="#ececec"/>
  <text x="663" y="171" text-anchor="start" font-size="13" fill="#c0504d">trap 128 链路变化 /</text>
  <text x="663" y="190" text-anchor="start" font-size="13" fill="#c0504d">trap 144 本地配置变化</text>

  <!-- 三台交换机 -->
  <rect x="70" y="270" width="170" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="155" y="300" text-anchor="middle" font-size="14" fill="#1a1a1a">交换机 1</text>
  <text x="155" y="323" text-anchor="middle" font-size="14" fill="#1a1a1a">SMA 更新转发表</text>

  <rect x="328" y="270" width="170" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="413" y="300" text-anchor="middle" font-size="14" fill="#1a1a1a">交换机 2</text>
  <text x="413" y="323" text-anchor="middle" font-size="14" fill="#1a1a1a">SMA 更新转发表</text>

  <rect x="587" y="270" width="170" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="672" y="300" text-anchor="middle" font-size="14" fill="#1a1a1a">交换机 3</text>
  <text x="672" y="323" text-anchor="middle" font-size="14" fill="#1a1a1a">SMA 更新转发表</text>

  <!-- 底部说明 -->
  <rect x="69.5" y="370" width="687" height="60" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="413" y="394" text-anchor="middle" font-size="12" fill="#333333">所有 LFT 下发完毕、LID 分配到位后，子网进入稳态，SM 停在 Master 态持续服务</text>
  <text x="413" y="414" text-anchor="middle" font-size="12" fill="#333333">SM 监听设备上报的 trap 128 / 144，触发重扫以保持子网视图与实际一致</text>
</svg>
