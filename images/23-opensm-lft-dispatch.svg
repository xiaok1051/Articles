<svg xmlns="http://www.w3.org/2000/svg" width="827" height="620" viewBox="0 0 827 620" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="827" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
    <marker id="arrow-trap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c0504d"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="413" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">LFT 下发与稳态：分块下发 + trap 回环</text>

  <!-- SM -->
  <rect x="313" y="60" width="200" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="413" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">SM（Master）</text>
  <text x="413" y="116" text-anchor="middle" font-size="12" fill="#333333">持有算好的 LFT</text>

  <!-- 旁注：SMP 写 LFT -->
  <rect x="30" y="60" width="252" height="72" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="156" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">SMP 写 LinearForwardingTable</text>
  <text x="156" y="110" text-anchor="middle" font-size="11.5" fill="#333333">（分块下发，逐块确认）</text>

  <!-- 三台交换机 -->
  <rect x="70" y="270" width="170" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="155" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">交换机 1</text>
  <text x="155" y="324" text-anchor="middle" font-size="11" fill="#333333">SMA 更新转发表</text>

  <rect x="328" y="270" width="170" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="413" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">交换机 2</text>
  <text x="413" y="324" text-anchor="middle" font-size="11" fill="#333333">SMA 更新转发表</text>

  <rect x="587" y="270" width="170" height="72" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="672" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">交换机 3</text>
  <text x="672" y="324" text-anchor="middle" font-size="11" fill="#333333">SMA 更新转发表</text>

  <!-- 下发箭头 -->
  <line x1="413" y1="132" x2="155" y2="268" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="413" y1="132" x2="413" y2="268" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="413" y1="132" x2="672" y2="268" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- trap 回环 -->
  <path d="M 672 342 L 672 400 L 785 400 L 785 96 L 513 96" fill="none" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrow-trap)"/>
  <text x="600" y="430" text-anchor="middle" font-size="13" fill="#c0504d">trap 128 链路变化 / trap 144 本地配置变化</text>
  <text x="600" y="452" text-anchor="middle" font-size="12" fill="#555555">→ 触发重扫（sweep_on_trap，默认开启）</text>

  <!-- 底部说明 -->
  <rect x="70" y="470" width="687" height="60" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="413" y="496" text-anchor="middle" font-size="13" fill="#333333">所有 LFT 下发完毕、LID 分配到位后，子网进入稳态，SM 停在 Master 态持续服务</text>
  <text x="413" y="518" text-anchor="middle" font-size="12" fill="#888888">SM 监听设备上报的 trap 128 / 144，触发重扫以保持子网视图与实际一致</text>
</svg>
