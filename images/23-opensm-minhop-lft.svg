<svg xmlns="http://www.w3.org/2000/svg" width="827" height="620" viewBox="0 0 827 620" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="827" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6c8ebf"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="413" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">minhop：Dijkstra 最短路径 → 线性转发表 LFT</text>

  <!-- 分区标题 -->
  <text x="235" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">拓扑（以 SW1 为源）</text>
  <text x="655" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">SW1 的 LFT（线性转发表）</text>

  <!-- SW1 -->
  <rect x="170" y="80" width="130" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="235" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">SW1（源）</text>
  <text x="235" y="130" text-anchor="middle" font-size="11" fill="#333333">port 1 / 2 / 3</text>

  <!-- SW2 -->
  <rect x="60" y="230" width="110" height="60" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="115" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">SW2</text>

  <!-- SW3 -->
  <rect x="300" y="230" width="110" height="60" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="355" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">SW3</text>

  <!-- HCA A -->
  <rect x="60" y="360" width="110" height="60" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="115" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">HCA A</text>
  <text x="115" y="406" text-anchor="middle" font-size="12" fill="#333333">LID 5</text>

  <!-- HCA B -->
  <rect x="300" y="360" width="110" height="60" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="355" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">HCA B</text>
  <text x="355" y="406" text-anchor="middle" font-size="12" fill="#333333">LID 6</text>

  <!-- HCA C（直连 SW1） -->
  <rect x="360" y="80" width="110" height="64" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="415" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">HCA C</text>
  <text x="415" y="128" text-anchor="middle" font-size="12" fill="#333333">LID 7</text>

  <!-- 链路 -->
  <line x1="205" y1="144" x2="115" y2="228" stroke="#666666" stroke-width="1.5"/>
  <line x1="265" y1="144" x2="355" y2="228" stroke="#666666" stroke-width="1.5"/>
  <line x1="115" y1="290" x2="115" y2="358" stroke="#666666" stroke-width="1.5"/>
  <line x1="355" y1="290" x2="355" y2="358" stroke="#666666" stroke-width="1.5"/>
  <line x1="300" y1="112" x2="358" y2="112" stroke="#666666" stroke-width="1.5"/>

  <!-- 端口标签 -->
  <text x="160" y="170" font-size="12" fill="#555555">port 1</text>
  <text x="300" y="170" font-size="12" fill="#555555">port 2</text>
  <text x="314" y="100" font-size="12" fill="#555555">port 3</text>

  <!-- Dijkstra 计算箭头 -->
  <line x1="475" y1="150" x2="543" y2="150" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="509" y="130" text-anchor="middle" font-size="12" fill="#6c8ebf">Dijkstra</text>
  <text x="509" y="172" text-anchor="middle" font-size="11" fill="#888888">算每个 LID 的</text>
  <text x="509" y="188" text-anchor="middle" font-size="11" fill="#888888">下一跳出端口</text>

  <!-- LFT 表 -->
  <rect x="550" y="80" width="240" height="200" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="670" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">LFT（以 LID 为下标）</text>
  <text x="670" y="132" text-anchor="middle" font-size="11" fill="#888888">下标 = LID，值 = 出端口号</text>
  <text x="670" y="162" text-anchor="middle" font-size="13" fill="#333333">LID 5 → 出端口 1（经 SW2）</text>
  <text x="670" y="190" text-anchor="middle" font-size="13" fill="#333333">LID 6 → 出端口 2（经 SW3）</text>
  <text x="670" y="218" text-anchor="middle" font-size="13" fill="#333333">LID 7 → 出端口 3（直连 HCA C）</text>
  <text x="670" y="250" text-anchor="middle" font-size="11" fill="#888888">查表转发：取目的 LID 当下标读表</text>

  <!-- 底部说明 -->
  <rect x="60" y="460" width="707" height="60" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="413" y="486" text-anchor="middle" font-size="13" fill="#333333">minhop 以每台交换机为源各跑一遍 Dijkstra，汇总成各自的 LFT</text>
  <text x="413" y="508" text-anchor="middle" font-size="12" fill="#888888">报文到交换机：取目的 LID → 读 LFT[LID] → 得出端口 → 转发</text>
</svg>
