<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#666666"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#999999"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">源码篇 3.4：trap 触发重扫的稳态回环</text>

  <!-- 稳态 -->
  <rect x="290" y="58" width="320" height="62" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="450" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">稳态：SM 停在 Master</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#444444">LFT 全部落位 · SA 常驻应答</text>

  <!-- trap 接收 -->
  <rect x="290" y="148" width="320" height="68" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">设备上报 trap（QP1 Notice）</text>
  <text x="450" y="193" text-anchor="middle" font-size="11" fill="#444444">osm_trap_rcv_process →</text>
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="#444444">trap_rcv_process_request：log_trap_info</text>

  <!-- 判断 -->
  <polygon points="450,243 565,288 450,333 335,288" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">trap ∈ {128, 144}</text>
  <text x="450" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">且 sweep_on_trap 开？</text>

  <!-- 否：noisy 处理 -->
  <rect x="608" y="256" width="222" height="64" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="719" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">trap 129 / 130 / 131 等</text>
  <text x="719" y="298" text-anchor="middle" font-size="11" fill="#444444">shutup_noisy_port 标记，不重扫</text>

  <!-- 是：置标志 + 唤醒 -->
  <rect x="290" y="360" width="320" height="58" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="450" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2c28">force_heavy_sweep = TRUE</text>
  <text x="450" y="401" text-anchor="middle" font-size="11" fill="#444444">osm_sm_signal(OSM_SIGNAL_SWEEP) 唤醒 sweeper</text>

  <!-- heavy sweep -->
  <rect x="290" y="444" width="320" height="58" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="466" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">sweeper 醒来 → do_sweep（heavy）</text>
  <text x="450" y="485" text-anchor="middle" font-size="11" fill="#444444">重扫拓扑 → LID → 路由 → set_lft_block</text>

  <!-- 主干箭头 -->
  <line x1="450" y1="120" x2="450" y2="146" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="216" x2="450" y2="241" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="333" x2="450" y2="358" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="418" x2="450" y2="442" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 判断分支 -->
  <line x1="565" y1="288" x2="606" y2="288" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="280" text-anchor="middle" font-size="11" fill="#777777">否</text>
  <text x="460" y="350" text-anchor="start" font-size="11" fill="#777777">是</text>

  <!-- 右侧回环：noisy 处理完回到稳态 -->
  <polyline points="719,256 719,89 612,89" fill="none" stroke="#999999" stroke-width="1.4" marker-end="url(#arrow-gray)"/>
  <rect x="727" y="166" width="108" height="20" fill="#ffffff"/>
  <text x="729" y="181" text-anchor="start" font-size="11" fill="#999999">记录后回稳态</text>

  <!-- 左侧回环：LFT 写回确认后回到稳态 -->
  <polyline points="290,473 260,473 260,89 288,89" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="106" y="268" width="150" height="36" fill="#ffffff"/>
  <text x="181" y="284" text-anchor="middle" font-size="10.5" fill="#555555">osm_lft_rcv_process</text>
  <text x="181" y="300" text-anchor="middle" font-size="10.5" fill="#777777">逐块确认写回 lft</text>
</svg>
