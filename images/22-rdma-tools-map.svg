<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510">
  <g font-family="Helvetica Neue, Helvetica, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="400" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RDMA 用户态工具地图</text>

    <g>
      <rect x="30" y="66" width="350" height="190" rx="8" fill="#000000" opacity="0.07"/>
      <rect x="30" y="64" width="350" height="190" rx="8" fill="#ffffff" stroke="#6c8ebf"/>
      <path d="M30 98 L30 72 Q30 64 38 64 L372 64 Q380 64 380 72 L380 98 Z" fill="#dae8fc"/>
      <line x1="30" y1="98" x2="380" y2="98" stroke="#6c8ebf"/>
      <rect x="30" y="64" width="350" height="190" rx="8" fill="none" stroke="#6c8ebf"/>
      <text x="205" y="87" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IB 原生工具</text>
      <text x="46" y="125" font-size="12" fill="#333333">拓扑查询：ibstat · ibnetdiscover · iblinkinfo</text>
      <text x="46" y="146" font-size="12" fill="#333333">子网管理：opensm</text>
      <text x="46" y="167" font-size="12" fill="#333333">SM/SA 查询：sminfo · smpquery · saquery</text>
      <text x="46" y="188" font-size="12" fill="#333333">诊断：ibdiagnet · ibcheck* · ibping · ibtracert</text>
      <text x="46" y="209" font-size="12" fill="#333333">计数器：perfquery</text>
      <text x="46" y="230" font-size="12" fill="#333333">转发表：dump_lfts / dump_mfts · ibroute</text>
    </g>

    <g>
      <rect x="420" y="66" width="350" height="190" rx="8" fill="#000000" opacity="0.07"/>
      <rect x="420" y="64" width="350" height="190" rx="8" fill="#ffffff" stroke="#82b366"/>
      <path d="M420 98 L420 72 Q420 64 428 64 L762 64 Q770 64 770 72 L770 98 Z" fill="#d5e8d4"/>
      <line x1="420" y1="98" x2="770" y2="98" stroke="#82b366"/>
      <rect x="420" y="64" width="350" height="190" rx="8" fill="none" stroke="#82b366"/>
      <text x="595" y="87" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">打流 / 性能</text>
      <text x="436" y="142" font-size="12" fill="#333333">ib_write_bw · ib_read_bw（带宽）</text>
      <text x="436" y="165" font-size="12" fill="#333333">ib_send_bw · ib_atomic_bw（带宽）</text>
      <text x="436" y="188" font-size="12" fill="#333333">ib_write_lat 等 *_lat 系列（延迟）</text>
      <text x="436" y="211" font-size="12" fill="#333333">qperf（快速性能基线）</text>
    </g>

    <g>
      <rect x="30" y="280" width="350" height="190" rx="8" fill="#000000" opacity="0.07"/>
      <rect x="30" y="278" width="350" height="190" rx="8" fill="#ffffff" stroke="#d79b00"/>
      <path d="M30 312 L30 286 Q30 278 38 278 L372 278 Q380 278 380 286 L380 312 Z" fill="#ffe6cc"/>
      <line x1="30" y1="312" x2="380" y2="312" stroke="#d79b00"/>
      <rect x="30" y="278" width="350" height="190" rx="8" fill="none" stroke="#d79b00"/>
      <text x="205" y="301" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RoCE / 通用 Linux</text>
      <text x="46" y="356" font-size="12" fill="#333333">rdma link / rdma statistic（链路视角）</text>
      <text x="46" y="379" font-size="12" fill="#333333">ibv_devices / ibv_devinfo（verbs 查询）</text>
      <text x="46" y="402" font-size="12" fill="#333333">ethtool -S / ip -s link（网卡计数器）</text>
      <text x="46" y="425" font-size="12" fill="#333333">sysfs：/sys/class/infiniband/*/counters</text>
    </g>

    <g>
      <rect x="420" y="280" width="350" height="190" rx="8" fill="#000000" opacity="0.07"/>
      <rect x="420" y="278" width="350" height="190" rx="8" fill="#ffffff" stroke="#9673a6"/>
      <path d="M420 312 L420 286 Q420 278 428 278 L762 278 Q770 278 770 286 L770 312 Z" fill="#e1d5e7"/>
      <line x1="420" y1="312" x2="770" y2="312" stroke="#9673a6"/>
      <rect x="420" y="278" width="350" height="190" rx="8" fill="none" stroke="#9673a6"/>
      <text x="595" y="301" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">抓包 / 解码</text>
      <text x="436" y="356" font-size="12" fill="#333333">RoCEv2 报文：UDP 4791</text>
      <text x="436" y="379" font-size="12" fill="#333333">tcpdump / tshark / wireshark</text>
      <text x="436" y="402" font-size="12" fill="#333333">识别 GRH / BTH、QP、PSN 与重传</text>
      <text x="436" y="425" font-size="12" fill="#333333">IB 原生报文不适用以太网抓包</text>
    </g>

    <text x="400" y="494" font-size="11" text-anchor="middle" fill="#666666">命令基线：Linux + rdma-core 生态；IB 原生工具依赖 SM 组建的子网</text>
  </g>
</svg>
