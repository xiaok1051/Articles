<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" viewBox="0 0 820 510" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="510" fill="#ffffff"/>

  <!-- 泳道标题 -->
  <rect x="30" y="18" width="350" height="30" rx="6" fill="#6c8ebf"/>
  <text x="205" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">发送：主机 → 网络</text>
  <rect x="440" y="18" width="350" height="30" rx="6" fill="#82b366"/>
  <text x="615" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">接收：网络 → 主机</text>

  <!-- 发送步骤 -->
  <g font-size="12.5" fill="#333333">
    <rect x="30" y="55" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="82" text-anchor="middle">① 驱动把请求写成 WQE，放进 SQ</text>
    <rect x="30" y="111" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="138" text-anchor="middle">② 驱动写门铃，通知网卡</text>
    <rect x="30" y="167" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="194" text-anchor="middle">③ DMA 引擎读 WQE</text>
    <rect x="30" y="223" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="250" text-anchor="middle">④ 查 MR 页表，翻译地址（VA → PA）</text>
    <rect x="30" y="279" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="306" text-anchor="middle">⑤ DMA 引擎按物理地址搬数据到网卡</text>
    <rect x="30" y="335" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="362" text-anchor="middle">⑥ 包处理引擎组包（加协议头 + ICRC）</text>
    <rect x="30" y="391" width="350" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
    <text x="205" y="418" text-anchor="middle">⑦ 传输引擎把包发到网络</text>
  </g>

  <!-- 接收步骤 -->
  <g font-size="12.5" fill="#333333">
    <rect x="440" y="55" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="82" text-anchor="middle">① 包从 MAC/PHY 进来</text>
    <rect x="440" y="111" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="138" text-anchor="middle">② 包处理引擎解析包头（提取 dest QP / PSN）</text>
    <rect x="440" y="167" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="194" text-anchor="middle">③ 分类器定位目标 QP，读 QP 上下文</text>
    <rect x="440" y="223" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="250" text-anchor="middle">④ RETH 地址翻译（VA → PA）</text>
    <rect x="440" y="279" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="306" text-anchor="middle">⑤ DMA 引擎把 payload 写进主机内存</text>
    <rect x="440" y="335" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="362" text-anchor="middle">⑥ 硬件写 CQE 到完成队列</text>
    <rect x="440" y="391" width="350" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
    <text x="615" y="418" text-anchor="middle">⑦ 通知主机（中断 / 轮询）</text>
  </g>

  <!-- 泳道内箭头 -->
  <g stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="205" y1="99" x2="205" y2="107"/>
    <line x1="205" y1="155" x2="205" y2="163"/>
    <line x1="205" y1="211" x2="205" y2="219"/>
    <line x1="205" y1="267" x2="205" y2="275"/>
    <line x1="205" y1="323" x2="205" y2="331"/>
    <line x1="205" y1="379" x2="205" y2="387"/>
    <line x1="615" y1="99" x2="615" y2="107"/>
    <line x1="615" y1="155" x2="615" y2="163"/>
    <line x1="615" y1="211" x2="615" y2="219"/>
    <line x1="615" y1="267" x2="615" y2="275"/>
    <line x1="615" y1="323" x2="615" y2="331"/>
    <line x1="615" y1="379" x2="615" y2="387"/>
  </g>

  <!-- 底部零 CPU 标注 -->
  <rect x="30" y="455" width="760" height="36" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="410" y="479" text-anchor="middle" font-size="14" font-weight="bold" fill="#a87200">全程零 CPU 参与（kernel bypass）——数据从应用内存直达网卡，不经 CPU 指令流</text>
</svg>
