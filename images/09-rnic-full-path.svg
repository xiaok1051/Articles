<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d79b00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>

  <!-- 主机软件 -->
  <rect x="20" y="50" width="130" height="230" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="85" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">主机软件</text>
  <text x="85" y="175" text-anchor="middle" font-size="12" fill="#444444">应用 / verbs</text>
  <text x="85" y="193" text-anchor="middle" font-size="12" fill="#444444">/ 驱动</text>

  <!-- 网络 -->
  <rect x="740" y="165" width="100" height="44" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="790" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">网络 (RoCEv2)</text>

  <!-- 网卡芯片大框 -->
  <rect x="180" y="20" width="530" height="300" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="190" y="40" font-size="13" font-weight="bold" fill="#555555">网卡芯片</text>

  <!-- 控制面（上） -->
  <text x="210" y="52" font-size="11.5" font-weight="bold" fill="#5b7d3b">控制面：一次性建资源（慢）</text>
  <rect x="210" y="60" width="120" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
  <text x="270" y="87" text-anchor="middle" font-size="12.5" fill="#333333">管理队列</text>
  <rect x="360" y="60" width="130" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
  <text x="425" y="87" text-anchor="middle" font-size="12.5" fill="#333333">控制核固件</text>
  <rect x="520" y="60" width="160" height="44" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.3"/>
  <text x="600" y="87" text-anchor="middle" font-size="12.5" fill="#333333">配置 QP/MR 表项</text>

  <!-- 数据面（下） -->
  <text x="210" y="152" font-size="11.5" font-weight="bold" fill="#a87200">数据面：每次收发（快 · 零 CPU）</text>
  <rect x="210" y="165" width="100" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <text x="260" y="192" text-anchor="middle" font-size="12.5" fill="#333333">门铃</text>
  <rect x="340" y="165" width="120" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <text x="400" y="192" text-anchor="middle" font-size="12.5" fill="#333333">DMA 搬数据</text>
  <rect x="490" y="165" width="160" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/>
  <text x="570" y="192" text-anchor="middle" font-size="12.5" fill="#333333">组包 / 传输引擎</text>

  <!-- 控制面箭头（虚线绿） -->
  <g stroke="#82b366" stroke-width="1.6" stroke-dasharray="5 3" fill="none">
    <line x1="150" y1="82" x2="206" y2="82" marker-end="url(#arrC)"/>
    <line x1="330" y1="82" x2="356" y2="82" marker-end="url(#arrC)"/>
    <line x1="490" y1="82" x2="516" y2="82" marker-end="url(#arrC)"/>
  </g>
  <!-- 控制面 → 数据面 配置箭头 -->
  <line x1="600" y1="104" x2="600" y2="161" stroke="#82b366" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrC)"/>
  <text x="610" y="138" font-size="11" fill="#5b7d3b">配置</text>

  <!-- 数据面箭头（实线橙） -->
  <g stroke="#d79b00" stroke-width="1.6" fill="none">
    <line x1="150" y1="187" x2="206" y2="187" marker-end="url(#arrD)"/>
    <line x1="310" y1="187" x2="336" y2="187" marker-end="url(#arrD)"/>
    <line x1="460" y1="187" x2="486" y2="187" marker-end="url(#arrD)"/>
    <line x1="650" y1="187" x2="736" y2="187" marker-end="url(#arrD)"/>
  </g>

  <!-- 图例 -->
  <g font-size="11.5" fill="#333333">
    <line x1="210" y1="345" x2="250" y2="345" stroke="#82b366" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="258" y="349">控制面（建资源，一次性 · 慢）</text>
    <line x1="460" y1="345" x2="500" y2="345" stroke="#d79b00" stroke-width="1.6"/>
    <text x="508" y="349">数据面（收发，每次 · 快 · 零 CPU）</text>
  </g>
</svg>
