<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" font-family="PingFang SC, Heiti SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="620" fill="#ffffff"/>

  <!-- 顶部外部：主机 / 网络 -->
  <rect x="40" y="50" width="120" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="100" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">主机</text>
  <text x="100" y="98" text-anchor="middle" font-size="12" fill="#444444">(CPU + 内存)</text>

  <rect x="660" y="50" width="120" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="720" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">网络</text>
  <text x="720" y="98" text-anchor="middle" font-size="12" fill="#444444">(RoCEv2)</text>

  <!-- 接口层 -->
  <rect x="40" y="190" width="120" height="55" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="100" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">PCIe 控制器</text>
  <text x="100" y="231" text-anchor="middle" font-size="11" fill="#555555">(MMIO + DMA)</text>

  <rect x="660" y="190" width="120" height="55" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="720" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">MAC / PHY</text>
  <text x="720" y="231" text-anchor="middle" font-size="11" fill="#555555">(含 SerDes)</text>

  <!-- 内部互连总线 -->
  <rect x="40" y="285" width="740" height="40" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="410" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b3d63">内部互连总线（片上总线 / 交叉开关 / NoC）</text>

  <!-- 分区虚线框 -->
  <rect x="40" y="365" width="350" height="220" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="386" font-size="13" font-weight="bold" fill="#5b7d3b">可编程部分（核 + 固件）</text>

  <rect x="430" y="365" width="350" height="220" fill="none" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="386" font-size="13" font-weight="bold" fill="#a87200">固定功能部分（数据面引擎）</text>

  <!-- 可编程部分块 -->
  <rect x="60" y="405" width="145" height="60" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="132" y="429" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">控制核</text>
  <text x="132" y="449" text-anchor="middle" font-size="11" fill="#444444">(实时核，跑固件)</text>

  <rect x="225" y="405" width="145" height="60" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="297" y="429" text-anchor="middle" font-size="13" fill="#333333">紧耦合内存</text>
  <text x="297" y="449" text-anchor="middle" font-size="11" fill="#555555">(核私有)</text>

  <rect x="60" y="495" width="145" height="60" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="132" y="530" text-anchor="middle" font-size="13" fill="#333333">辅助核</text>

  <rect x="225" y="495" width="145" height="60" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="297" y="519" text-anchor="middle" font-size="13" fill="#333333">共享片上内存</text>
  <text x="297" y="539" text-anchor="middle" font-size="11" fill="#555555">(多主共享)</text>

  <!-- 固定功能部分块 -->
  <rect x="450" y="405" width="100" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="500" y="435" text-anchor="middle" font-size="12" fill="#333333">QP 上下文表</text>

  <rect x="565" y="405" width="95" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="612" y="426" text-anchor="middle" font-size="12" fill="#333333">完成队列</text>
  <text x="612" y="443" text-anchor="middle" font-size="11" fill="#555555">(CQ)</text>

  <rect x="675" y="405" width="90" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="720" y="426" text-anchor="middle" font-size="12" fill="#333333">门铃</text>
  <text x="720" y="443" text-anchor="middle" font-size="11" fill="#555555">(Doorbell)</text>

  <rect x="450" y="495" width="100" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="500" y="525" text-anchor="middle" font-size="12" fill="#333333">DMA 引擎</text>

  <rect x="565" y="495" width="95" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="612" y="525" text-anchor="middle" font-size="12" fill="#333333">包处理引擎</text>

  <rect x="675" y="495" width="90" height="50" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="720" y="525" text-anchor="middle" font-size="12" fill="#333333">传输引擎</text>

  <!-- 数据流箭头 -->
  <line x1="100" y1="120" x2="100" y2="186" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="245" x2="100" y2="281" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="285" x2="720" y2="250" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="190" x2="720" y2="125" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
